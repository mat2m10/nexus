[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
 
[project]
name = "nexus"
version = "0.1.0"
description = "Coalescent simulation and population-genetics pipeline."
requires-python = ">=3.10"
# Minimum versions are the oldest set the pipeline was tested with (see
# requirements.txt for the exact, fully pinned set used for reproducible runs).
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.11.4",          # clustering (scipy.cluster.hierarchy / spatial)
    "scikit-learn>=1.3.2",
    "matplotlib>=3.8.4",
    "pandas>=2.1.4",          # for the parquet-based gene scripts
    "pyarrow>=14.0.2",        # parquet engine for pandas
]
 
[tool.setuptools]
# Only ship the helpers package; ignore scripts/, notebooks/, data/.
packages = ["helpers"]
 