name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # scipy is imported by the pipeline; listed explicitly until it is a
          # declared dependency in pyproject.toml (it also arrives via scikit-learn).
          pip install -e ".[test]" scipy
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -q
